<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>NV Recorder Bar</title>
  <link rel="stylesheet" href="mini.css">
</head>
<body>
  <div class="pill">
    <span id="dot" class="dot"></span>
    <span id="label" class="label">Starting</span>
    <span id="time" class="time">00:00</span>
    <button id="pause" type="button" title="Pause / Resume  (Ctrl+Shift+P)">&#10074;&#10074;</button>
    <button id="stop" class="stop" type="button" title="Stop  (Ctrl+Shift+R)">&#9632;</button>
  </div>
  <script src="mini.js"></script>
</body>
</html>
